name: Proof contracts

on:
  pull_request:
    paths:
      - ".github/workflows/proof-contracts.yml"
      - "README.md"
      - "CONTRIBUTING.md"
      - "SECURITY.md"
      - ".github/CODEOWNERS"
      - "package.json"
      - "package-lock.json"
      - "docs/current-public-proof-map.md"
      - "docs/recoverable-observer-fixture-pack.md"
      - "docs/structured-result-trust-receipt.md"
      - "docs/openclaw-clawhub-submission-readiness.md"
      - "examples/lib/structured-result-trust.mjs"
      - "examples/recoverable-observer/**"
      - "examples/structured-result-trust/**"
      - "schemas/**"
      - "scripts/verify-recoverable-observer-fixture-pack.mjs"
      - "scripts/verify-protocol-contract-mirror.mjs"
      - "scripts/verify-structured-result-trust-receipt.mjs"
      - "scripts/verify-openclaw-submission-readiness.mjs"
      - "tests/recoverable-observer-fixture-pack.test.mjs"
      - "tests/structured-result-trust-receipt.test.mjs"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/proof-contracts.yml"
      - "README.md"
      - "CONTRIBUTING.md"
      - "SECURITY.md"
      - ".github/CODEOWNERS"
      - "package.json"
      - "package-lock.json"
      - "docs/current-public-proof-map.md"
      - "docs/recoverable-observer-fixture-pack.md"
      - "docs/structured-result-trust-receipt.md"
      - "docs/openclaw-clawhub-submission-readiness.md"
      - "examples/lib/structured-result-trust.mjs"
      - "examples/recoverable-observer/**"
      - "examples/structured-result-trust/**"
      - "schemas/**"
      - "scripts/verify-recoverable-observer-fixture-pack.mjs"
      - "scripts/verify-protocol-contract-mirror.mjs"
      - "scripts/verify-structured-result-trust-receipt.mjs"
      - "scripts/verify-openclaw-submission-readiness.mjs"
      - "tests/recoverable-observer-fixture-pack.test.mjs"
      - "tests/structured-result-trust-receipt.test.mjs"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repo
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify proof contracts
        run: npm run check

      - name: Audit dependencies
        run: npm audit --audit-level=high

  node-22-compatibility:
    name: Node 22 public compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repo
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Node 22
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.14.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify public compatibility
        run: npm run check
